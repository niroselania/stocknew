# Pegá esto tal cual en Portainer > Stacks > Web editor
services:
  stock-buscador:
    build:
      context: .
      dockerfile: Dockerfile
    image: stock-buscador:3.1.1
    container_name: stock-buscador
    restart: unless-stopped
    ports:
      - "8085:8000"
    volumes:
      - stock-data:/data
    environment:
      HISTORY_MAX: "30"
      # Opcional: pedir un código para subir o borrar planillas
      # UPLOAD_TOKEN: "cambiar-este-codigo"
      # Bot de Telegram (opcional): token de @BotFather e ids de chat autorizados
      # TELEGRAM_BOT_TOKEN: "123456789:AAxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
      # TELEGRAM_ALLOWED_CHATS: "123456789,-1001234567890"
      # PRICE_COLUMN: "RETAIL"   # el precio sale de la columna RETAIL; cambiar sólo si el encabezado es otro

volumes:
  stock-data:

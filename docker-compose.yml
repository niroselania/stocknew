services:
  stock-buscador:
    build: .
    image: stock-buscador:3.1.1
    pull_policy: build        # en Portainer: reconstruye la imagen en cada redeploy
    container_name: stock-buscador
    restart: unless-stopped
    ports:
      - "8085:8000"
    volumes:
      - stock-data:/data
    environment:
      HISTORY_MAX: "30"
      # Estos valores se cargan en Portainer > Stack > Environment variables
      # (no hace falta escribir el token acá; si una variable no existe, queda vacía).
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_CHATS: ${TELEGRAM_ALLOWED_CHATS:-}
      TELEGRAM_BASE: ${TELEGRAM_BASE:-LOCAL}
      UPLOAD_TOKEN: ${UPLOAD_TOKEN:-}
      PRICE_COLUMN: ${PRICE_COLUMN:-}
      # Segundo bot (opcional): consulta la base BARI. Necesita su propio token de @BotFather.
      TELEGRAM_BOT_TOKEN_BARI: ${TELEGRAM_BOT_TOKEN_BARI:-}
      TELEGRAM_ALLOWED_CHATS_BARI: ${TELEGRAM_ALLOWED_CHATS_BARI:-}

volumes:
  stock-data:

services:
  stock-buscador:
    build: .
    container_name: stock-buscador
    restart: unless-stopped
    ports:
      - "8085:8000"
    volumes:
      - /opt/stock-buscador/data:/data
    environment:
      HISTORY_MAX: "30"
      # Opcional: pedir un código para subir o borrar planillas
      # UPLOAD_TOKEN: "cambiar-este-codigo"

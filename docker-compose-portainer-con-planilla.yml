services:
  stock-buscador:
    build: .
    container_name: stock-buscador
    restart: unless-stopped
    ports:
      - "8085:8000"
    volumes:
      - /opt/stock-buscador/data:/data
    environment:
      HISTORY_MAX: "30"
      # Valores: Portainer > Stack > Environment variables
      UPLOAD_TOKEN: ${UPLOAD_TOKEN:-}
      # Bot de Telegram (opcional): token de @BotFather e ids de chat autorizados
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_CHATS: ${TELEGRAM_ALLOWED_CHATS:-}
      # Opcional: ids que pueden subir la planilla mandándole el .xlsx al bot (vacío = no se puede)
      TELEGRAM_UPLOAD_CHATS: ${TELEGRAM_UPLOAD_CHATS:-}
      PRICE_COLUMN: ${PRICE_COLUMN:-}
      TELEGRAM_BASE: ${TELEGRAM_BASE:-LOCAL}
